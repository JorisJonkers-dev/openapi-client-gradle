'name': 'Publish on Tag'

'on':
  'push':
    'tags':
      - 'v*'

'permissions':
  'contents': 'read'
  'packages': 'write'

'jobs':
  'publish':
    'name': 'Publish Maven Artifact'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'
      - 'uses': 'JorisJonkers-dev/github-workflows/actions/setup-java-gradle@38aa4e9ea4a2adfdcfc210967f540023e05bca07' # v0.48.0
        'with':
          'java-version': '21'
          'packages-proxy-token': '${{ secrets.PACKAGES_PROXY_TOKEN }}'
          'require-package-proxy': true
      - 'run': './gradlew publish --no-daemon --no-parallel --max-workers=1'
        'env':
          'GITHUB_ACTOR': '${{ github.actor }}'
          'GITHUB_TOKEN': '${{ secrets.GITHUB_TOKEN }}'
